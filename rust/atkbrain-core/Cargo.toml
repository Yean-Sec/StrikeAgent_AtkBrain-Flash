[package]
name = "atkbrain-core"
version = "1.1.0"
edition = "2021"
description = "控制台数据、配置与业务。不依赖 Python。"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
argon2 = "0.5"
rsa = { version = "0.9", features = ["pem", "sha2"] }
rand = "0.8"
regex = "1"
sha1 = "0.10"
